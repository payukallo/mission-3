<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar</title>
    <link rel="stylesheet" href="./daftar.css" />
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img
          id="logo"
          src="/assets/images/Pasted image.png"
          width="243"
          height="64px"
        />
      </div>
      <div class="title">
        <h1>Daftar</h1>
        <p>Selamat datang</p>
      </div>
      <div class="userName">
        <label for="userName">Username</label>
        <input id="userName" type="text" placeholder="Masukkan username" />
      </div>
      <div class="password">
        <label for="newPassword">Kata Sandi</label>
        <input
          id="newPassword"
          type="password"
          placeholder="Masukkan kata sandi"
        />
      </div>
      <div class="password">
        <label for="password">Konfirmasi Kata Sandi</label>
        <input
          id="password"
          type="password"
          placeholder="Masukkan kata sandi"
        />

        <div class="newAccount">
          <p>Sudah punya akun? <a href="index.html">Masuk</a></p>
        </div>
      </div>
      <div class="login">
        <button id="log">Daftar</button>
        <span>Atau</span>

        <button class="google-login">
          <img src="./assets/images/google_logo_icon_169090.png" width="20px" />
          Daftar dengan Goggle
        </button>
      </div>
    </div>
  </body>
</html>
