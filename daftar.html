<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar</title>
    <link rel="stylesheet" href="./styles/daftar.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
      <div class="container">
        <div class="logo">
          <img
            id="logo"
            src="/assets/logo/movie.png"
            width="163px"
            height="44px"
          />
        </div>
        <div class="title">
          <h3 class="heading-3">Daftar</h3>
          <p class="body-medium-regular">Selamat datang!</p>
        </div>
        <div class="userName body-large-medium">
          <label for="userName">Username</label>
          <input
            class="body-medium-regular"
            id="userName"
            type="text"
            placeholder="Masukkan username"
          />
        </div>
        <div class="password body-large-medium">
          <label for="password">Kata Sandi</label>
          <input
            class="body-medium-regular"
            id="password"
            type="password"
            placeholder="Masukkan kata sandi"
          />
        </div>
        <div class="password-container">
          <div class="password body-large-medium">
            <label for="password">Konfirmasi Kata Sandi</label>
            <input
              class="body-medium-regular"
              id="password"
              type="password"
              placeholder="Masukkan kata sandi"
            />
          </div>
          <div class="account body-medium-regular">
            <span
              >Sudah punya akun?
              <a class="body-medium-medium" href="index.html">Masuk</a></span
            >
          </div>
        </div>
        <div class="login body-medium-semiBold">
          <button class="body-medium-semiBold" id="regis" >Daftar</button>
          <span class="body-small-medium">Atau</span>

          <button class="google-login body-medium-semiBold">
            <img
              src="./assets/logo/google.png"
              width="18px"
            />
            Daftar dengan Goggle
          </button>
        </div>
      </div>
  </body>
</html>
