<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <div class="logo">
        <img id="logo" src="/assets/images/Pasted image.png" width="243" height="64px" />
      </div>
      <div class="title">
        <h1>Masuk</h1>
        <p>Selamat datang kembali</p>
      </div>
      <div class="userName">
        <label for="userName">Username</label>
        <input id="userName" type="text" placeholder="Masukkan username" />
      </div>
      <div class="password">
        <label for="password">Kata Sandi</label>
        <input
          id="password"
          type="password"
          placeholder="Masukkan kata sandi"
        />
        <div class="newAccount">
          <p>Belum punya akun? <a href="daftar.html">Daftar</a></p>
          <p><a href="">Lupa kata sandi?</a></p>
        </div>
      </div>
      <div class="login">
        <button id="log">Masuk</button>
        <span>Atau</span>

        <button class="google-login">
          <img src="./assets/images/google_logo_icon_169090.png" width="20px" />
          Masuk dengan Goggle
        </button>
      </div>
    </div>
  </body>
</html>
